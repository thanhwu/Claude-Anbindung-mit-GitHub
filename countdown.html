<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahresende-Countdown &amp; Wetter</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2F2F7;
    --card-bg: #FFFFFF;
    --label: #000000;
    --secondary-label: #8E8E93;
    --separator: rgba(60, 60, 67, 0.29);
    --blue: #007AFF;
    --shadow: rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1C1C1E;
      --label: #FFFFFF;
      --secondary-label: #8E8E93;
      --separator: rgba(84, 84, 88, 0.6);
      --blue: #0A84FF;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    padding: 24px;
  }
  #bubu-dudu {
    max-width: 320px;
    width: 100%;
    border-radius: 24px;
    box-shadow: 0 8px 24px var(--shadow);
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 18px 20px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 590;
    color: var(--secondary-label);
    margin: 0 0 14px;
  }
  #countdown-btn {
    display: block;
    width: 100%;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: inherit;
    font: inherit;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .countdown-grid {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .countdown-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }
  .countdown-value {
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--blue);
  }
  .countdown-label {
    font-size: 12px;
    font-weight: 400;
    color: var(--secondary-label);
    margin-top: 2px;
  }
  .weather-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .weather-icon {
    font-size: 32px;
    line-height: 1;
  }
  .weather-main {
    flex: 1;
  }
  .weather-title {
    font-size: 17px;
    font-weight: 590;
  }
  .weather-sub {
    font-size: 13px;
    color: var(--secondary-label);
    margin-top: 2px;
  }
</style>
</head>
<body>

<img id="bubu-dudu" src="assets/bubu-dudu.jpg" alt="Bubu und Dudu beim Picknick">

<div class="card">
  <p class="card-title">Bis Jahresende</p>
  <button id="countdown-btn" type="button" aria-live="polite">
    <div class="countdown-grid">
      <div class="countdown-unit">
        <span class="countdown-value" id="days">--</span>
        <span class="countdown-label">Tage</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-value" id="hours">--</span>
        <span class="countdown-label">Std.</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-value" id="minutes">--</span>
        <span class="countdown-label">Min.</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-value" id="seconds">--</span>
        <span class="countdown-label">Sek.</span>
      </div>
    </div>
  </button>
</div>

<div class="card">
  <p class="card-title">Wetter in Düsseldorf</p>
  <div class="weather-row">
    <span class="weather-icon" id="weather-icon">⏳</span>
    <div class="weather-main">
      <div class="weather-title" id="weather-text">Lädt…</div>
      <div class="weather-sub" id="weather-detail"></div>
    </div>
  </div>
</div>

<script>
  function updateCountdown() {
    const now = new Date();
    const endOfYear = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
    let diffMs = endOfYear - now;
    if (diffMs < 0) diffMs = 0;

    const totalSeconds = Math.floor(diffMs / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById('days').textContent = days;
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  document.getElementById('countdown-btn').addEventListener('click', updateCountdown);

  // Düsseldorf: 51.2277 N, 6.7735 E
  const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=51.2277&longitude=6.7735&daily=precipitation_sum,weather_code&timezone=Europe%2FBerlin&forecast_days=1';

  const RAIN_CODES = new Set([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99]);

  async function loadWeather() {
    const iconEl = document.getElementById('weather-icon');
    const textEl = document.getElementById('weather-text');
    const detailEl = document.getElementById('weather-detail');
    try {
      const res = await fetch(WEATHER_URL);
      if (!res.ok) throw new Error('Wetterdienst nicht erreichbar');
      const data = await res.json();
      const code = data.daily.weather_code[0];
      const precipitation = data.daily.precipitation_sum[0];
      const willRain = RAIN_CODES.has(code) || precipitation > 0;

      iconEl.textContent = willRain ? '🌧️' : '☀️';
      textEl.textContent = willRain ? 'Regen erwartet' : 'Kein Regen';
      detailEl.textContent = `${precipitation.toFixed(1)} mm Niederschlag`;
    } catch (err) {
      iconEl.textContent = '⚠️';
      textEl.textContent = 'Nicht verfügbar';
      detailEl.textContent = 'Wetterdaten konnten nicht geladen werden';
    }
  }

  loadWeather();
</script>

</body>
</html>
