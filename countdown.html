<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahresende-Countdown</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --text: #1a1a1a;
    --accent: #d64545;
    --accent-hover: #b83636;
    --card-bg: #ffffff;
    --shadow: rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --text: #f0f0f0;
      --accent: #e2574c;
      --accent-hover: #ff6f61;
      --card-bg: #1f2229;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button#countdown-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 28px 44px;
    border: none;
    border-radius: 16px;
    background: var(--card-bg);
    box-shadow: 0 8px 24px var(--shadow);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button#countdown-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px var(--shadow);
  }
  button#countdown-btn:active {
    transform: translateY(0);
  }
  .label {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .value {
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    font-size: 16px;
    font-weight: 400;
    opacity: 0.7;
    margin-left: 4px;
  }
</style>
</head>
<body>

<button id="countdown-btn" type="button" aria-live="polite">
  <span class="label">Bis Jahresende</span>
  <span class="value"><span id="days">--</span><span class="unit">Tage</span> <span id="hours">--</span><span class="unit">Std.</span></span>
</button>

<script>
  function updateCountdown() {
    const now = new Date();
    const endOfYear = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
    let diffMs = endOfYear - now;
    if (diffMs < 0) diffMs = 0;

    const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
    const days = Math.floor(totalHours / 24);
    const hours = totalHours % 24;

    document.getElementById('days').textContent = days;
    document.getElementById('hours').textContent = hours;
  }

  updateCountdown();
  setInterval(updateCountdown, 60 * 1000);

  document.getElementById('countdown-btn').addEventListener('click', updateCountdown);
</script>

</body>
</html>
